services:
  # make check in a container with the same toolchain as CI.
  # Run through `make docker-check`, which sets --user to the host uid:gid.
  dev:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
      - venv:/opt/venv            # keep the Linux venv apart from the host .venv
      - cache:/cache              # uv, Go modules, Go build, golangci-lint

  # Python runtime image (benchmarks from stage 0 on)
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    env_file:
      - path: .env
        required: false
    init: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  # Isolated signer: no network until stage 5 defines its unix socket
  signer:
    build:
      context: .
      dockerfile: docker/signer.Dockerfile
    init: true
    network_mode: none
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  # Local chain for stage 4+: `docker compose --profile chain up anvil`
  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.10.1@sha256:477ed6a2574fcec250633915433201994a92dc7476697cda02adf684d9b42092
    profiles: [chain]
    entrypoint: ["anvil", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:8545:8545"   # localhost only

volumes:
  venv:
  cache:

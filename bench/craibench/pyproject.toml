[project]
name = "taintwall-bench-craibench"
version = "0.0.0"
description = "CrAIBench runs for taintwall: plain-agent baseline, later the taintwall pipeline."
requires-python = ">=3.12,<3.13"  # the fork pins 3.12; its tokenizers pin has no 3.13 wheel
license = "Apache-2.0"
dependencies = [
    # CrAIBench is an AgentDojo fork that also installs as `agentdojo`, hence
    # its own project. Pinned to the reviewed commit (docs/craibench-review.md).
    "agentdojo @ git+https://github.com/AthaSSiN/CrAIBench@e41eac1eb2fea00a31c69827bfe83f9722a25702",
    "taintwall-bench-common",
]

[dependency-groups]
dev = ["mypy>=2.4", "pytest>=8.3"]

[tool.pytest.ini_options]
# The runner modules sit next to the tests, not in an installed package.
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.uv]
# Supply-chain cooldown: nothing uploaded in the last two weeks (as Dependabot).
exclude-newer = "14 days"
required-version = ">=0.13.7,<0.14"
package = false
# The fork imports provider SDK names that later releases removed, so every
# dependency is held at CrAIBench's own requirements.lock (same commit),
# except its dev-tool pins (pathspec, mypy-extensions), which would hold back
# our own mypy, and packages with known vulnerabilities, which are released
# to patched versions (see the comment on security below).
# Security: aiohttp (with yarl, multidict, frozenlist, aiosignal), urllib3,
# h11/httpcore, anyio/idna/sniffio, certifi,
# requests, deepdiff, protobuf, fsspec and the langchain family are not
# pinned, so they resolve to patched releases (106 Dependabot alerts on the
# old lock). The fork still runs on them: checked by its offline tests and
# a live task. The SDKs that broke it (openai, cohere, pydantic,
# openapi-pydantic) stay at the fork's versions.
constraint-dependencies = [
    "anthropic==0.28.0",
    "attrs==23.2.0",
    "babel==2.15.0",
    "black==24.4.2",
    "boto3==1.34.120",
    "botocore==1.34.120",
    "cachetools==5.3.3",
    "charset-normalizer==3.3.2",
    "click==8.1.7",
    "cohere==5.5.3",
    "colorama==0.4.6",
    "distro==1.9.0",
    "dnspython==2.6.1",
    "docstring-parser==0.16",
    "email-validator==2.1.1",
    "fastavro==1.9.4",
    "filelock==3.14.0",
    "ghp-import==2.1.0",
    "google-api-core==2.19.0",
    "google-auth==2.29.0",
    "google-cloud-aiplatform==1.49.0",
    "google-cloud-bigquery==3.24.0",
    "google-cloud-core==2.4.1",
    "google-cloud-resource-manager==1.12.3",
    "google-cloud-storage==2.16.0",
    "google-crc32c==1.5.0",
    "google-resumable-media==2.7.0",
    "googleapis-common-protos==1.63.1",
    "griffe==0.45.3",
    "grpc-google-iam-v1==0.13.0",
    "grpcio-status==1.62.2",
    "grpcio==1.64.1",
    "httpx-sse==0.4.0",
    "httpx==0.27.0",
    "huggingface-hub==0.23.3",
    "jinja2==3.1.4",
    "jiter==0.4.1",
    "jmespath==1.0.1",
    "jsonpatch==1.33",
    "jsonpointer==2.4",
    "jsonref==1.1.0",
    "markdown-it-py==3.0.0",
    "markdown==3.6",
    "markupsafe==2.1.5",
    "mdurl==0.1.2",
    "mergedeep==1.3.4",
    "mkdocs-autorefs==1.0.1",
    "mkdocs-get-deps==0.2.0",
    "mkdocs-material-extensions==1.3.1",
    "mkdocs-material==9.5.26",
    "mkdocs==1.6.0",
    "mkdocstrings-python==1.10.3",
    "mkdocstrings==0.25.1",
    "mpmath==1.3.0",
    "networkx==3.3",
    "numpy==1.26.4",
    "openai==1.31.1",
    "openapi-pydantic==0.4.0",
    "orjson==3.10.3",
    "packaging==23.2",
    "paginate==0.5.6",
    "platformdirs==4.2.2",
    "proto-plus==1.23.0",
    "pyasn1-modules==0.4.0",
    "pyasn1==0.6.0",
    "pygments==2.18.0",
    "pymdown-extensions==10.8.1",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.0.1",
    "pyyaml-env-tag==0.1",
    "pyyaml==6.0.1",
    "regex==2024.5.15",
    "rich==13.7.1",
    "rsa==4.9",
    "s3transfer==0.10.1",
    "safetensors==0.4.3",
    "shapely==2.0.4",
    "six==1.16.0",
    "sqlalchemy==2.0.30",
    "sympy==1.12.1",
    "tenacity==8.3.0",
    "tokenizers==0.19.1",
    "torch==2.3.1",
    "tqdm==4.66.4",
    "transformers==4.41.2",
    "types-requests==2.32.0.20240602",
    "typing-extensions==4.12.1",
    "vertexai==1.49.0",
    "watchdog==4.0.1",
]

[tool.uv.sources]
taintwall-bench-common = { path = "../common", editable = true }

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# CrAIBench ships no type information.
module = ["agentdojo.*"]
ignore_missing_imports = true

[tool.uv.sources]
taintwall-bench-common = { path = "../common", editable = true }

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# CrAIBench ships no type information.
module = ["agentdojo.*"]
ignore_missing_imports = true

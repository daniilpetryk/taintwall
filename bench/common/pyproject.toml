[project]
name = "taintwall-bench-common"
version = "0.0.0"
description = "Shared pieces of the taintwall benchmark runners: metered, cached OpenRouter client and statistics."
requires-python = ">=3.12"  # CrAIBench runs on 3.12, AgentDojo on 3.13
license = "Apache-2.0"
dependencies = ["openai>=1.30", "pydantic>=2.7", "python-dotenv>=1.0.1"]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv]
# Supply-chain cooldown: nothing uploaded in the last two weeks (as Dependabot).
exclude-newer = "14 days"
required-version = ">=0.13.7,<0.14"

[tool.uv.build-backend]
module-name = "bench_common"

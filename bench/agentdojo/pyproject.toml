[project]
name = "taintwall-bench-agentdojo"
version = "0.0.0"
description = "AgentDojo runs for taintwall: plain-agent baseline, later the taintwall pipeline."
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
    "agentdojo==0.1.35",
    "taintwall-bench-common",
]

[dependency-groups]
dev = ["mypy>=2.4", "pytest>=8.3"]

[tool.pytest.ini_options]
# The runner modules sit next to the tests, not in an installed package.
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.uv]
# Supply-chain cooldown: nothing uploaded in the last two weeks (as Dependabot).
exclude-newer = "14 days"
required-version = ">=0.13.7,<0.14"
package = false

[tool.uv.sources]
taintwall-bench-common = { path = "../common", editable = true }

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
# AgentDojo ships no type information.
module = ["agentdojo.*"]
ignore_missing_imports = true

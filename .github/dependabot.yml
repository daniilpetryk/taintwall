version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    target-branch: dev
    groups:
      actions: { patterns: ["*"] }
    cooldown: { default-days: 7 }

  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    target-branch: dev
    groups:
      python: { patterns: ["*"] }
    cooldown: { default-days: 7 }

  - package-ecosystem: gomod
    directory: /signer
    schedule: { interval: weekly }
    target-branch: dev
    cooldown: { default-days: 7 }

  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: weekly }
    target-branch: dev
    groups:
      images: { patterns: ["*"] }
    cooldown: { default-days: 7 }

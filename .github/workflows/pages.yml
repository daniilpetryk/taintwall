name: pages

# Publishes docs/architecture.html (the diagrams) from the stable branch.
# The source file is page content without a document shell, so the build adds one.
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: build site
        run: |
          mkdir -p _site
          {
            printf '<!doctype html>\n<html lang="en">\n<head>\n'
            printf '<meta charset="utf-8">\n'
            printf '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'
            printf '</head>\n<body>\n'
            cat docs/architecture.html
            printf '\n</body>\n</html>\n'
          } > _site/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the site
      id-token: write # authenticate the deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # diff-cover compares with the base branch
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7" # keep in sync with [tool.uv] required-version
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pyrefly check
      - run: uv run lint-imports
      - run: uv run deptry src
      - run: uv run pylint src
      - run: uv run pytest --cov --cov-report=term --cov-report=xml
        env:
          HYPOTHESIS_PROFILE: ci
      # Every line a pull request adds or changes must be covered by a test.
      - name: diff coverage
        if: github.event_name == 'pull_request'
        run: uv run diff-cover coverage.xml --compare-branch="origin/${BASE_REF}" --fail-under=100
        env:
          BASE_REF: ${{ github.base_ref }}

  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: signer/go.mod
      - run: go mod tidy -diff
        working-directory: signer
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: signer
      - run: go test -race ./...
        working-directory: signer

  # Repo-wide hooks: secrets, Actions security, spelling, licensing, lock sync.
  # Language linters and hadolint are skipped here: their own jobs run them.
  hooks:
    name: hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7" # keep in sync with [tool.uv] required-version
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: signer/go.mod
      - run: uv sync --locked
      - run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: ruff-format,ruff-check,mypy,golangci-lint,hadolint

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7" # keep in sync with [tool.uv] required-version
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: signer/go.mod
      - run: make audit

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make lint-docker
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Multi-arch build proves the signer cross-compiles for both targets.
      - name: build signer (amd64, arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/signer.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=signer
          cache-to: type=gha,scope=signer,mode=max
      - name: load signer for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/signer.Dockerfile
          load: true
          tags: taintwall-signer:latest
          cache-from: type=gha,scope=signer
      - name: build app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/app.Dockerfile
          load: true
          tags: taintwall-app:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: scan images (fixable High/Critical fails)
        run: make scan-images

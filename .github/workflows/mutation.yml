name: mutation

# Mutation testing of taintwall.core: too slow for every pull request, so it
# runs nightly on dev and on demand. It fails below min_mutation_score
# ([tool.taintwall.quality] in pyproject.toml) and lists surviving mutants.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation
  cancel-in-progress: true

jobs:
  mutmut:
    name: mutmut
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: dev
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7" # keep in sync with [tool.uv] required-version
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run mutmut run --max-children 4
      - run: uv run python scripts/mutation_score.py

[project]
name = "taintwall"
version = "0.0.0"
description = "Prompt-injection defense runtime for AI agents with crypto wallets."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
authors = [{ name = "Daniil Petryk" }]
keywords = ["ai-agents", "prompt-injection", "llm-security", "taint-tracking", "web3"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/daniilpetryk/taintwall"

[dependency-groups]
dev = [
    "deptry>=0.25",
    "diff-cover>=11.0.0",
    "hypothesis>=6.170",
    "import-linter>=2.16",
    "mutmut>=3.8.1",
    "mypy>=2.4",
    "pip-audit>=2.10.1",
    "pre-commit>=4.0",
    "pylint>=4.1.3",
    "pyrefly>=1.4",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-randomly>=5.1",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

# --- uv ---------------------------------------------------------------------
# One uv minor version everywhere: local, CI (setup-uv `version`) and the
# Docker images (ghcr.io/astral-sh/uv tag). Bump all three together.

[tool.uv]
required-version = ">=0.13.7,<0.14"
# Supply-chain cooldown, the same as Dependabot's: a plain `uv lock` never
# picks a release younger than this. The bench projects use 14 days.
exclude-newer = "7 days"

# --- ruff: linter + formatter ---------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# Opt-out style: every stable rule is on, exceptions are listed with a reason.
# The ruff version is pinned in uv.lock, so new rules arrive only on upgrade.
select = ["ALL"]
# Design rules still in ruff preview, opted in one by one (clean-code gates,
# see docs/code-quality.md). Other preview rules stay off.
preview = true
explicit-preview-rules = true
extend-select = [
    "PLR0904",  # too many public methods on a class
    "PLR0914",  # too many local variables
    "PLR0916",  # too many boolean expressions in one condition
    "PLR0917",  # too many positional parameters
    "PLR1702",  # blocks nested too deeply
    "PLR6301",  # method that does not use self: make it a function
    "PLC2701",  # importing a private name from another module
]
ignore = [
    "COM812",  # trailing commas: handled by the formatter
    "D105",    # docstrings on magic methods: noise
    "D107",    # docstring on __init__: documented on the class
    "TD002",   # TODO author: git blame has it
    "FIX002",  # TODOs are allowed; TD003 still requires an issue link
]

[tool.ruff.lint.per-file-ignores]
# The mint is the one place allowed to use the capability token, which is
# private on purpose (also guarded by tests/test_architecture.py).
# Its methods use no state on purpose: holding a Mint instance is the
# capability, so they stay instance methods (PLR6301).
"src/taintwall/core/mint.py" = ["PLC2701", "PLR6301"]
"scripts/**" = [
    "INP001",  # standalone scripts, not a package
]
"bench/**" = [
    "INP001",  # benchmark runners are scripts in their own uv projects
]
"bench/*/tests/**" = [
    "S101",     # assert is how pytest works
    "D",        # test names are the documentation
    "PLR2004",  # magic values are normal in expected results
    "INP001",   # tests/ is not a package
]
"tests/**" = [
    "S101",     # assert is how pytest works
    "PLR6301",  # test classes group tests; methods need not use self
    "PLR0904",  # a test class may hold many tests
    "PLC2701",  # tests may reach into private helpers
    "D",        # test names are the documentation
    "PLR2004",  # magic values are normal in expected results
    "INP001",   # tests/ is not a package
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["taintwall"]

# Size and complexity limits: the numbers are the policy (docs/code-quality.md).
[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 5
max-branches = 10
max-returns = 5
max-statements = 40
max-locals = 12
max-public-methods = 12
max-bool-expr = 4
max-nested-blocks = 3

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Untrusted data is the whole threat model: no unsafe deserialization or shells.
"pickle".msg = "Never deserialize with pickle; use json or pydantic."
"marshal".msg = "Never deserialize with marshal; use json or pydantic."
"shelve".msg = "shelve uses pickle; use the label store (SQLite)."
"os.system".msg = "No shell execution; use subprocess with an argument list."
"os.popen".msg = "No shell execution; use subprocess with an argument list."
"random".msg = "Use secrets for anything security-relevant; seed-based random only in bench code."

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.format]
docstring-code-format = true

# --- mypy: strict typing ----------------------------------------------------

[tool.mypy]
python_version = "3.13"
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true
strict_bytes = true
local_partial_types = true
enable_error_code = [
    "deprecated",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]

# --- pyrefly: second type checker -------------------------------------------
# Different inference engine than mypy; both must pass. Cheap to keep clean
# while the codebase is small, expensive to adopt later.

[tool.pyrefly]
project-includes = ["src", "tests", "scripts"]
python-version = "3.13"
# The site scripts import each other as siblings, as they do when run.
search-path = ["src", "scripts"]

# --- import-linter: architecture contracts ----------------------------------
# These encode security invariants of the design, not just tidiness.

[tool.importlinter]
root_package = "taintwall"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Policy decisions never consult an LLM"
type = "forbidden"
source_modules = ["taintwall.policy"]
forbidden_modules = ["taintwall.llm"]

[[tool.importlinter.contracts]]
name = "The LLM layer cannot call tools or touch the chain"
type = "forbidden"
source_modules = ["taintwall.llm"]
forbidden_modules = ["taintwall.tools", "taintwall.web3", "taintwall.store"]

[[tool.importlinter.contracts]]
name = "Core (labels, interpreter) depends on no integration layer"
type = "forbidden"
source_modules = ["taintwall.core"]
forbidden_modules = ["taintwall.llm", "taintwall.tools", "taintwall.web3"]

[[tool.importlinter.contracts]]
# Allowlist, not denylist: a new subpackage cannot import the mint by default.
# The capability token itself is guarded by tests/test_architecture.py.
name = "Only core, policy and store can mint trusted provenance"
type = "protected"
protected_modules = ["taintwall.core.mint"]
allowed_importers = ["taintwall.core", "taintwall.policy", "taintwall.store"]

# Layers: a module may import only from layers below it. "a | b" are
# independent: same level, and they may not import each other.

[[tool.importlinter.contracts]]
name = "Core layers: interpreter > plan, values, mint > labels, errors"
type = "layers"
containers = ["taintwall.core"]
layers = ["interpreter", "plan | values | mint", "labels | errors"]

[[tool.importlinter.contracts]]
name = "Interpreter layers: entry point down to limits and trace"
type = "layers"
containers = ["taintwall.core.interpreter"]
layers = [
    "runtime",
    "evaluator",
    "reads | literals | operations | statements",
    "context",
    "tools",
    "builtins",
    "operators",
    "walk",
    "limits | trace | control",
    "arguments | location",
]

[[tool.importlinter.contracts]]
name = "Label layers: values > labels, immutability > sources > errors"
type = "layers"
containers = ["taintwall.core.labels"]
layers = ["value", "label | immutability", "source", "errors"]

[[tool.importlinter.contracts]]
name = "Subpackages form no import cycles"
type = "acyclic_siblings"
ancestors = ["taintwall"]

# --- mutmut: mutation testing (nightly, see .github/workflows/mutation.yml) -----

[tool.mutmut]
paths_to_mutate = ["src/taintwall/core/"]
also_copy = ["src/taintwall/"]  # the rest of the package, unmutated
tests_dir = ["tests/"]
# Tests that read source files check code shape, not behavior, and would
# see mutmut's instrumented copies; they run in the normal CI jobs.
pytest_add_cli_args = [
    "-p",
    "no:randomly",
    "-q",
    "--ignore=tests/test_code_quality.py",
    "--ignore=tests/test_architecture.py",
]

# --- pylint: duplicate code only ---------------------------------------------
# ruff implements the rest of pylint; it has no duplicate detection.

[tool.pylint.main]
disable = ["all"]
enable = ["duplicate-code"]

[tool.pylint.similarities]
min-similarity-lines = 6
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true

# --- clean-code limits ruff cannot express ----------------------------------
# Read by tests/test_architecture.py; see docs/code-quality.md.

[tool.taintwall.quality]
max_module_lines = 300       # physical lines per source module
max_function_lines = 40      # lines per function or method, docstring included
max_class_methods = 15       # methods per class, private ones included
banned_module_names = ["utils", "helpers", "common", "misc", "manager", "base"]
min_mutation_score = 98.0    # % of core mutants the tests catch (nightly); ratchet up
max_test_module_lines = 700  # tests: one file per module under test
max_test_function_lines = 40
# Packages below the top level (taintwall.core.labels, ...) are used only
# through their __init__ from outside. Exceptions, each with a reason:
allowed_internal_imports = [
    # the mint holds the capability token, which labels does not export
    "taintwall.core.mint -> taintwall.core.labels.source",
    "taintwall.core.mint -> taintwall.core.labels.label",
]

# --- typos: spelling ---------------------------------------------------------

[tool.typos.files]
# Model replies and benchmark task texts, kept verbatim (AgentDojo's own
# prompts have typos such as "suspicous").
extend-exclude = ["bench/results/agentdojo/plans/"]

[tool.typos.default]
# Linter rule codes (CPY001, S101, DL3008) are identifiers, not words.
extend-ignore-re = ["\\b[A-Z]{1,4}[0-9]{3,4}\\b"]

[tool.typos.default.extend-words]
# Python package names
certifi = "certifi"
# golangci-lint linter names
decorder = "decorder"
importas = "importas"

# --- deptry: declared vs used dependencies ----------------------------------

[tool.deptry]
known_first_party = ["taintwall"]

# --- pytest -----------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["taintwall"]
branch = true

[tool.coverage.report]
# CI fails below this (pytest --cov reads it). Branch coverage, see run.branch.
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

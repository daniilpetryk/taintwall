[project]
name = "taintwall"
version = "0.0.0"
description = "Prompt-injection defense runtime for AI agents with crypto wallets."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
authors = [{ name = "Daniil Petryk" }]
keywords = ["ai-agents", "prompt-injection", "llm-security", "taint-tracking", "web3"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/daniilpetryk/taintwall"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

# --- ruff: linter + formatter ---------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # naming
    "S",        # bandit (security)
    "PT",       # pytest style
    "RET",      # return statements
    "PTH",      # pathlib
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

[tool.ruff.lint.isort]
known-first-party = ["taintwall"]

[tool.ruff.format]
docstring-code-format = true

# --- mypy: strict typing ----------------------------------------------------

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["src", "tests"]

# --- pytest -----------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["taintwall"]
branch = true
